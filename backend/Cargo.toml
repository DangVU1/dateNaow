[package]
name = "datenaow"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "=1.0.105"
argon2 = "=0.6.0"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
dotenvy = "=0.15.7"
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "=0.5.3", features = ["timeout", "util"] }
tower-http = { version = "=0.7.1", features = ["trace", "request-id"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
utoipa = "=6.0.0"
uuid = { version = "=1.29.3", features = ["serde"] }
validator = { version = "=0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "=0.1.5"
